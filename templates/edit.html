<!DOCTYPE html>
<html>
<head>
    <title>Edit Book</title>
    <head>
    <title>Edit Book</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
</head>
<body>
    <h1>Edit Book</h1>

    <form action="/edit_book/{{ book.id }}" method="POST">
        <label>Title:</label><br>
        <input type="text" name="title" value="{{ book.title }}" required><br><br>

        <label>Author:</label><br>
        <input type="text" name="author" value="{{ book.author }}" required><br><br>

        <label>Category:</label><br>
        <input type="text" name="category" value="{{ book.category }}"><br><br>

        <label>Total Copies:</label><br>
        <input type="number" name="total_copies" value="{{ book.total_copies }}"><br><br>

        <button type="submit">Update Book</button>
    </form>

    <a href="/">Back to Home</a>
</body>
</html>
